# Optional wiring for apps using symfony/dependency-injection.
# Import it from your own services.yaml:
#
#   imports:
#       - { resource: '../vendor/derafu/certificate/resources/config/certificate-services.yaml' }

services:

    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # Derafu OpenSSL Service (the only one that calls OpenSSL).
    Derafu\Certificate\Contract\OpenSslInterface:
        class: Derafu\Certificate\Service\OpenSsl

    # Derafu Certificate Service (entry point for the library).
    Derafu\Certificate\Contract\CertificateServiceInterface:
        class: Derafu\Certificate\Service\CertificateService

    # Derafu Certificate Faker (handles the generation of self-signed
    # certificates for testing).
    Derafu\Certificate\Contract\CertificateFakerInterface:
        class: Derafu\Certificate\Service\CertificateFaker

    # Derafu Certificate Loader (handles the configuration and loading of
    # digital certificates).
    Derafu\Certificate\Contract\CertificateLoaderInterface:
        class: Derafu\Certificate\Service\CertificateLoader

    # Derafu Certificate Validator (handles the validation of digital
    # certificates).
    Derafu\Certificate\Contract\CertificateValidatorInterface:
        class: Derafu\Certificate\Service\CertificateValidator

    # Feeds resources/translations into the consuming app's Translator (the
    # app must pass $resourceProviders: !tagged_iterator
    # derafu_translation.resource_provider to TranslatorFactory::create(),
    # see derafu/translation's translation-services.yaml). The tag is
    # explicit because _instanceof does not propagate across imported files.
    Derafu\Certificate\Translation\CertificateTranslationResourceProvider:
        tags: ['derafu_translation.resource_provider']
